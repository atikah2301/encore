<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Encore</title>
    <meta name="description" content="Track the theatre shows you've seen, and the ones you want to see next" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#3b0a1a" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Encore" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Login -->
      <section id="view-login" class="view">
        <header class="app-header login-header">
          <h1>🎭 Encore</h1>
          <p class="login-subtitle">Please sign in</p>
        </header>
        <form id="login-form" class="card">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required />
          <label for="login-password">Password</label>
          <div class="password-field">
            <input id="login-password" type="password" autocomplete="current-password" required />
            <button type="button" id="login-password-toggle" class="password-toggle" aria-label="Show password">👁️</button>
          </div>
          <p id="login-error" class="error-message" aria-live="polite" hidden></p>
          <button type="submit" class="primary">Enter</button>
        </form>
      </section>

      <!-- Main app (post-login) -->
      <section id="view-main" class="view" hidden>
        <div class="app-shell">
          <aside class="sidebar">
            <div class="title-version">
              <h1>🎭 Encore</h1>
              <span class="version-tag"></span>
            </div>
            <nav class="tabs">
              <button type="button" data-tab="wishlist" class="active">Wishlist</button>
              <button type="button" data-tab="history">History</button>
              <button type="button" data-tab="venues">Venues</button>
            </nav>
            <button id="logout-button" class="secondary">Log out</button>
          </aside>

          <main class="main-content">
            <div id="tab-wishlist" class="tab-panel"></div>
            <div id="tab-history" class="tab-panel" hidden></div>
            <div id="tab-venues" class="tab-panel" hidden></div>
          </main>
        </div>
      </section>
    </div>

    <script type="module" src="js/version-init.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/sw-register.js"></script>
  </body>
</html>
